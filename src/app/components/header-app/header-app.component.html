<mat-toolbar class="sticky top-0 z-50">
  <div class="w-full flex flex-row items-center justify-between">
    <span (click)="onDashboard()">JZP Beta</span>
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      class="example-icon"
      aria-label="Example icon-button with menu icon"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onLearn()">
        <span>Learn</span>
      </button>
      <button mat-menu-item disabled>
        <span>Review</span>
      </button>
      <button mat-menu-item (click)="onProfile()">
        <span>Profile</span>
      </button>
      <button mat-menu-item>
        <span>Practice</span>
      </button>
      <button mat-menu-item>
        <span>Support</span>
      </button>
      <button mat-menu-item>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<router-outlet></router-outlet>
