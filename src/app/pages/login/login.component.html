<div class="flex items-center justify-center h-screen bg-gray-100 px-4 sm:px-6 lg:px-8">
  <div class="bg-white rounded-lg shadow-lg p-6 sm:p-8 w-full max-w-sm sm:max-w-md">
    <h2 class="text-xl sm:text-2xl font-bold text-center mb-4 sm:mb-6">Login</h2>
    <form>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          id="email"
          class="w-full px-3 py-2 sm:px-4 sm:py-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Enter your email"
        />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          id="password"
          class="w-full px-3 py-2 sm:px-4 sm:py-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Enter your password"
        />
      </div>
      <btn full (click)="onLogin()" variation="primary" class="w-full">Login</btn>
    </form>
    <p class="text-sm text-center text-gray-600 mt-4">
      Don't have an account? <a href="/register" class="text-indigo-500 hover:underline">Sign up</a>
    </p>
  </div>
</div>
