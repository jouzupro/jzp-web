<div class="bg-gray-50 p-4 rounded-lg shadow-md space-y-4 m-4">
  <mat-spinner *ngIf="base === undefined"></mat-spinner>

  <kj-detail *ngIf="kanji != undefined" [data]="kanji" [goTo]="getDetail" />
  <rd-detail *ngIf="radical != undefined" [data]="radical" [goTo]="getDetail" />
  <vc-detail
    *ngIf="vocabulary != undefined"
    [data]="vocabulary"
    [goTo]="getDetail"
  />
</div>
