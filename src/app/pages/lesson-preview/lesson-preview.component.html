<div class="bg-white p-6 rounded-lg shadow-md flex justify-center items-center">
  <div class="flex flex-col items-center w-full">
    <div class="flex items-center w-full mb-5">
      <mat-icon (click)="closeSession()"
        aria-hidden="false"
        aria-label="Example home icon"
        fontIcon="close"
        class="mr-2"
        style="color: black"
      ></mat-icon>
      <div class="flex-grow h-5 rounded-md bg-gray-200 overflow-hidden">
        <div
          class="h-full bg-blue-500 transition-width duration-300 ease-in-out"
          [style.width.%]="progressPercentage"
          id="progress-bar"
        ></div>
      </div>
    </div>

    <div
      class="text-3xl md:text-3xl font-normal mb-6 text-gray-800 text-center"
    >
      <p>What is the {{ currentQuestion.type }} of this kanji?</p>
    </div>
    <div
      *ngIf="answered && isCorrect"
      class="text-xl mb-5 font-bold p-4 bg-green-500 rounded-md"
    >
      <ct color="white" size="header">CORRECT!</ct>
    </div>
    <div
      *ngIf="answered && !isCorrect"
      class="text-xl mb-5 font-bold p-4 bg-red-500 rounded-md"
    >
      <ct color="white">WRONG!</ct>
    </div>
    <div
      class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4 w-full md:w-1/2 mb-5 justify-center"
    >
      <div
        class="text-6xl md:text-9xl text-gray-900 font-extrabold text-center"
      >
        {{ currentQuestion.kanji }}
      </div>
      <div class="w-full" *ngIf="answered">
        <div *ngIf="answered && isCorrect" class="flex justify-center">
          <div class="w-24 mb-5 font-bold p-2 bg-green-500 rounded-md">
            <div class="flex flex-row gap-x-2">
              <mat-icon
                aria-hidden="false"
                fontIcon="arrow_upward"
                style="color: white"
              ></mat-icon>
              <ct color="white">Master</ct>
            </div>
          </div>
        </div>
        <div *ngIf="answered && !isCorrect" class="flex justify-center">
          <div class="w-24 mb-5 font-bold p-2 bg-red-500 rounded-md">
            <div class="flex flex-row gap-x-2">
              <mat-icon
                aria-hidden="false"
                fontIcon="arrow_downward"
                style="color: white"
              ></mat-icon>
              <ct color="white">Pemula</ct>
            </div>
          </div>
        </div>
        <div *ngIf="isAnswerTypo === 'typo'" class="text-black mb-3">
          Your answer seems a little bit off
        </div>
        <app-expansion-panel title="Readings">
          <div class="flex items-center space-x-4 mb-3">
            <btn variation="secondary" (click)="onListen()" [isLoading]="!voicesLoaded">
              <mat-icon
                aria-hidden="false"
                aria-label="Example home icon"
                fontIcon="spatial_audio_off"
                style="color: black"
              ></mat-icon>
            </btn>
            <ct color="white" size="sub-header">{{
              currentQuestion.answer
            }}</ct>
          </div>

          <ct color="white">this is how your read</ct>
        </app-expansion-panel>
        <app-expansion-panel title="Meaning">
          <ct color="white">this is the meaning</ct>
        </app-expansion-panel>
      </div>
    </div>

    <div class="w-full md:w-1/2">
      <input
        type="text"
        class="w-full px-4 py-2 text-black border border-gray-300 rounded-md text-lg focus:ring focus:ring-blue-300 focus:border-blue-500"
        placeholder="Enter your answer"
        [(ngModel)]="romajiInput"
        (input)="onInputChange()"
        (keyup.enter)="onEnter()"
        [ngClass]="{
          'bg-green-100 focus:border-green-700 focus:ring-green-300 ring-green-300 border-green-700':
            isCorrect === true,
          'bg-red-100 focus:border-red-700 focus:ring-red-300 ring-red-300 border-red-700':
            isCorrect === false
        }"
        [style.outline-color]="
          isCorrect === true ? 'green' : isCorrect === false ? 'red' : null
        "
        [style.outline-style]="isCorrect !== null ? 'solid' : null"
        [style.outline-width.px]="isCorrect !== null ? 2 : null"
      />
    </div>
  </div>
</div>
